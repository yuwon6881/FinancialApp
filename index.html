<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Use the light surface as the static fallback because Chromium-based
         installed PWAs can retain this initial value for Android's system bars.
         The pre-paint script and App.tsx replace it for saved dark mode. -->
    <meta name="theme-color" content="#f6f8fc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Apply the saved theme BEFORE first paint. In a standalone PWA the OS
         status bar (top) and gesture-nav (bottom) draw the page background when
         Chrome runs edge-to-edge (Chrome 135+ with viewport-fit=cover). If the
         root background is still the hard-coded dark launch color at that first
         frame, those safe-area regions read as black bars in light mode. This
         mirrors the dark_mode logic in useAppPreferences so the surface + the
         theme-color meta are correct from the very first frame. -->
    <!-- External because the production CSP intentionally blocks inline scripts. -->
    <script src="/theme-init.js"></script>
    <!-- Inter is self-hosted via @fontsource-variable/inter (imported in index.css);
         degrades to SF Pro / Segoe UI while it loads -->
    <title>FinancialApp — Ledger</title>
    <style>
      /* Base surface + safe-area fill. Kept theme-aware (the startup script above
         sets the root color for an explicit saved choice; this media query is
         the pre-script fallback) so the PWA status-bar / gesture-nav regions
         never flash the wrong color. body inherits the root's resolved color. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: #f6f8fc;
      }
      html {
        --launch-surface: #f6f8fc;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #0a0d14;
        }
        html {
          --launch-surface: #0a0d14;
        }
      }
      body {
        background: inherit;
      }

      /* Inline splash overlay — painted by the browser as soon as the HTML is
         parsed, long before any JS evaluates.  React's createRoot().render()
         replaces #root's children, which automatically removes this element. */
      #__splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--launch-surface);
      }
      #__splash svg {
        width: 56px;
        height: 56px;
        animation: __splash-pulse 1.8s ease-in-out infinite;
      }
      @keyframes __splash-pulse {
        0%, 100% { opacity: .35; }
        50% { opacity: .85; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Inline splash: visible instantly from raw HTML until React mounts -->
      <div id="__splash" aria-hidden="true">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M30 32h40v8H38v12h28v8H38v16h-8V32z" fill="#60a5fa"/>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

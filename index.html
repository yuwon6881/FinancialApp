<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0d14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f8fc" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Inter for a premium, tabular-numeral read; degrades to SF Pro / Segoe UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap"
      rel="stylesheet"
    />
    <title>FinancialApp — Ledger</title>
    <style>
      html,
      body {
        background: #0a0d14;
      }
      #launch-veil {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #0a0d14;
        opacity: 1;
        transition: opacity 160ms ease;
      }
      #launch-veil[data-hide="true"] {
        opacity: 0;
        pointer-events: none;
      }
      #launch-veil img {
        width: 72px;
        height: 72px;
        padding: 14px;
        border-radius: 22px;
        background: rgba(2, 6, 23, 0.92);
        border: 1px solid rgba(125, 211, 252, 0.24);
        box-shadow: 0 0 32px rgba(56, 189, 248, 0.28);
      }
    </style>
  </head>
  <body>
    <div id="launch-veil" aria-hidden="true">
      <img src="/favicon.svg" alt="" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

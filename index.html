<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Single, unscoped theme-color. The in-app theme is a manual toggle (not
         tied to prefers-color-scheme), so App.tsx updates this value to keep the
         status bar / system chrome in sync. Media-scoped variants would ignore
         that toggle and leave a mismatched (black-looking) bar in the PWA. -->
    <meta name="theme-color" content="#0a0d14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Apply the saved theme BEFORE first paint. In a standalone PWA the OS
         status bar (top) and gesture-nav (bottom) draw the page background when
         Chrome runs edge-to-edge (Chrome 135+ with viewport-fit=cover). If the
         root background is still the hard-coded dark launch color at that first
         frame, those safe-area regions read as black bars in light mode. This
         mirrors the dark_mode logic in useAppPreferences so the surface + the
         theme-color meta are correct from the very first frame. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('dark_mode');
          var isDark = stored === 'true' ? true
            : stored === 'false' ? false
            : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var surface = isDark ? '#0a0d14' : '#f6f8fc';
          var root = document.documentElement;
          if (isDark) root.classList.add('dark');
          root.style.backgroundColor = surface;
          root.style.colorScheme = isDark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', surface);
        } catch (e) { /* localStorage unavailable — fall back to CSS defaults */ }
      })();
    </script>
    <!-- Inter is self-hosted via @fontsource-variable/inter (imported in index.css);
         degrades to SF Pro / Segoe UI while it loads -->
    <title>FinancialApp — Ledger</title>
    <style>
      /* Base surface + safe-area fill. Kept theme-aware (the inline script above
         sets the root color for an explicit saved choice; this media query is
         the pre-script fallback) so the PWA status-bar / gesture-nav regions
         never flash the wrong color. body inherits the root's resolved color. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0a0d14;
      }
      @media (prefers-color-scheme: light) {
        html,
        body {
          background: #f6f8fc;
        }
      }
      body {
        background: inherit;
      }

      /* Inline splash overlay — painted by the browser as soon as the HTML is
         parsed, long before any JS evaluates.  React's createRoot().render()
         replaces #root's children, which automatically removes this element. */
      #__splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0d14;
      }
      #__splash svg {
        width: 56px;
        height: 56px;
        animation: __splash-pulse 1.8s ease-in-out infinite;
      }
      @keyframes __splash-pulse {
        0%, 100% { opacity: .35; }
        50% { opacity: .85; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Inline splash: visible instantly from raw HTML until React mounts -->
      <div id="__splash" aria-hidden="true">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M30 32h40v8H38v12h28v8H38v16h-8V32z" fill="#60a5fa"/>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

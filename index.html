<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0d14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f8fc" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Inter for a premium, tabular-numeral read; degrades to SF Pro / Segoe UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap"
      rel="stylesheet"
    />
    <title>FinancialApp — Ledger</title>
    <!-- Paint the correct theme background on the very first frame, before the
         JS bundle loads and React mounts. Without this the window is blank on
         cold start, which on installed PWAs shows as a white/home-screen flash
         between the splash screen and the app. Also applies the dark class
         early so there's no flash of the wrong theme. -->
    <script>
      (function () {
        try {
          var dark = localStorage.getItem('dark_mode') === 'true'
          var root = document.documentElement
          if (dark) root.classList.add('dark')
          root.style.backgroundColor = dark ? '#0a0d14' : '#f6f8fc'
        } catch (e) {}
      })()
    </script>
    <style>
      html, body, #root { background-color: #f6f8fc; min-height: 100%; }
      html.dark, html.dark body, html.dark #root { background-color: #0a0d14; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Dark is the static fallback on purpose. Chromium bakes this value (and the
         manifest's theme_color) into the installed WebAPK and keeps using it for
         Android's status and navigation bars instead of the live updates below, so
         whichever colour ships here is effectively permanent for installed users.
         A retained dark bar reads as chrome against either theme; a retained white
         one is glaring against the dark surface. theme-init.js and
         useAppThemeAndShortcuts.ts still track the saved theme wherever the browser
         honours live theme-color changes, notably browser tabs. -->
    <meta name="theme-color" content="#0b0e14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      /* Critical launch paint. Keep this before every external resource so the
         first document frame matches Chrome's manifest-generated splash even
         when its service worker or renderer takes longer to start. */
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--launch-surface, #0b0e14);
      }
      html {
        --launch-surface: #0b0e14;
      }
      body {
        min-height: 100vh;
      }

      /* This overlay is deliberately outside #root. React cannot remove it
         during its first commit; the launch handoff removes it only after a
         complete app frame has painted. */
      #__splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--launch-surface, #0b0e14);
      }
      #__splash svg {
        width: 56px;
        height: 56px;
        animation: __splash-pulse 1.8s ease-in-out infinite;
      }
      #__splash svg path {
        fill: var(--launch-accent, #e6b450);
      }
      @keyframes __splash-pulse {
        0%, 100% { opacity: .35; }
        50% { opacity: .85; }
      }
    </style>
    <!-- Apply the saved app theme after the critical splash CSS is available.
         External because the production CSP intentionally blocks inline scripts. -->
    <script src="/theme-init.js"></script>
    <!-- Inter is self-hosted via @fontsource-variable/inter (imported in index.css);
         degrades to SF Pro / Segoe UI while it loads -->
    <title>FinancialApp — Ledger</title>
  </head>
  <body>
    <!-- Logo-only launch surface. It intentionally contains no visible title. -->
    <div id="__splash" aria-hidden="true">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M30 32h40v8H38v12h28v8H38v16h-8V32z" fill="var(--launch-accent, #e6b450)"/>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

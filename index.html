<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Single, unscoped theme-color. The in-app theme is a manual toggle (not
         tied to prefers-color-scheme), so App.tsx updates this value to keep the
         status bar / system chrome in sync. Media-scoped variants would ignore
         that toggle and leave a mismatched (black-looking) bar in the PWA. -->
    <meta name="theme-color" content="#0a0d14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Inter is self-hosted via @fontsource-variable/inter (imported in index.css);
         degrades to SF Pro / Segoe UI while it loads -->
    <title>FinancialApp — Ledger</title>
    <style>
      /* Ensure the page surface is always the app's dark background so there
         is never a white or transparent flash between the native splash
         dismissing and the first real frame painting (warm-relaunch fix). */
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0a0d14;
      }

      /* Inline splash overlay — painted by the browser as soon as the HTML is
         parsed, long before any JS evaluates.  React's createRoot().render()
         replaces #root's children, which automatically removes this element. */
      #__splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0d14;
      }
      #__splash svg {
        width: 56px;
        height: 56px;
        animation: __splash-pulse 1.8s ease-in-out infinite;
      }
      @keyframes __splash-pulse {
        0%, 100% { opacity: .35; }
        50% { opacity: .85; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Inline splash: visible instantly from raw HTML until React mounts -->
      <div id="__splash" aria-hidden="true">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M30 32h40v8H38v12h28v8H38v16h-8V32z" fill="#60a5fa"/>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Dark is the static fallback on purpose. Chromium bakes this value (and the
         manifest's theme_color) into the installed WebAPK and keeps using it for
         Android's status and navigation bars instead of the live updates below, so
         whichever colour ships here is effectively permanent for installed users.
         A retained dark bar reads as chrome against either theme; a retained white
         one is glaring against the dark surface. theme-init.js and
         useAppThemeAndShortcuts.ts still track the saved theme wherever the browser
         honours live theme-color changes, notably browser tabs. -->
    <meta name="theme-color" content="#090b11" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      /* Critical launch paint. Keep this before every external resource so the
         first document frame matches Chrome's manifest-generated splash even
         when its service worker or renderer takes longer to start. */
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--launch-surface, #090b11);
      }
      html {
        --launch-surface: #090b11;
      }
      body {
        min-height: 100vh;
      }

      /* This overlay is deliberately outside #root. React cannot remove it
         during its first commit; the launch handoff removes it only after a
         complete app frame has painted. */
      #__splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--launch-surface, #090b11);
      }
      /* The brand tile: the plan's four buckets as one ring, lighting up in turn while the app
         loads. Same mark as the launcher icon (scripts/brand-mark.mjs), flat colour only. */
      #__splash svg {
        width: 64px;
        height: 64px;
        border-radius: 15px;
      }
      #__splash rect {
        fill: var(--launch-accent, #4f49e6);
      }
      #__splash path {
        fill: none;
        stroke: #fff;
        stroke-width: 12;
        animation: __splash-segment 1.4s cubic-bezier(.22, 1, .36, 1) infinite;
      }
      #__splash path:nth-child(2) { animation-delay: .16s; }
      #__splash path:nth-child(3) { animation-delay: .32s; }
      #__splash path:nth-child(4) { animation-delay: .48s; }
      @keyframes __splash-segment {
        0%, 100% { opacity: .32; }
        35% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #__splash path { animation: none; }
      }
    </style>
    <!-- Apply the saved app theme after the critical splash CSS is available.
         External because the production CSP intentionally blocks inline scripts. -->
    <script src="/theme-init.js"></script>
    <!-- Geist is self-hosted via @fontsource-variable/geist (imported in index.css);
         degrades to SF Pro / Segoe UI while it loads -->
    <title>FinancialApp — Ledger</title>
  </head>
  <body>
    <!-- Logo-only launch surface. It intentionally contains no visible title. -->
    <div id="__splash" aria-hidden="true">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="100"/>
        <g>
          <path d="M51.83 29.08A21 21 0 0 1 55.44 70.28"/>
          <path d="M51.83 70.92A21 21 0 0 1 29.72 55.44"/>
          <path d="M29.08 51.83A21 21 0 0 1 34.64 35.68"/>
          <path d="M37.36 33.23A21 21 0 0 1 48.17 29.08"/>
        </g>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

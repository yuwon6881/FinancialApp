<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Growth Line Gradient -->
    <linearGradient id="growthGrad" x1="156" y1="306" x2="316" y2="146" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Gold Dot Gradient -->
    <linearGradient id="goldDotGrad" x1="196" y1="246" x2="216" y2="266" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Outer Glow for Gold Dot -->
    <radialGradient id="goldGlow" cx="206" cy="256" r="20" fx="206" fy="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Transparent Background -->
  <rect width="100%" height="100%" fill="none" />

  <g filter="url(#subtle-shadow)">
    <!-- 1. GRID SYSTEM (Horizontal & Vertical Ledger Lines) -->
    <!-- Horizontal Ledger Rows -->
    <line x1="130" y1="206" x2="382" y2="206" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" opacity="0.4" />
    <line x1="130" y1="256" x2="382" y2="256" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" opacity="0.4" />
    <line x1="130" y1="306" x2="382" y2="306" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" opacity="0.4" />

    <!-- Vertical Column Divider -->
    <line x1="206" y1="130" x2="206" y2="382" stroke="#64748B" stroke-width="8" stroke-linecap="round" opacity="0.6" />

    <!-- 2. FLOW/GROWTH PATH (Rising Ledger Trend) -->
    <line x1="156" y1="306" x2="316" y2="146" stroke="url(#growthGrad)" stroke-width="12" stroke-linecap="round" />

    <!-- 3. HIGHLIGHT NODES -->
    <!-- Target Balance Point at the End of Trend Line -->
    <circle cx="316" cy="146" r="14" fill="#3B82F6" />
    <circle cx="316" cy="146" r="6" fill="#FFFFFF" />

    <!-- Core Transaction Node at the Center Intersection (206, 256) -->
    <circle cx="206" cy="256" r="20" fill="url(#goldGlow)" />
    <circle cx="206" cy="256" r="9" fill="url(#goldDotGrad)" stroke="#FFFFFF" stroke-width="2" />
  </g>
</svg>

name: Android

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: 'npm'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare stable device-test signing key
        if: github.event_name != 'pull_request'
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64"
          test -n "$ANDROID_DEBUG_KEY_ALIAS"
          test -n "$ANDROID_DEBUG_KEYSTORE_PASSWORD"
          test -n "$ANDROID_DEBUG_KEY_PASSWORD"
          keystore="$RUNNER_TEMP/financialapp-device-test.p12"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "ANDROID_DEBUG_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "ANDROID_DEBUG_KEY_ALIAS=$ANDROID_DEBUG_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_DEBUG_KEYSTORE_PASSWORD=$ANDROID_DEBUG_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_DEBUG_KEY_PASSWORD=$ANDROID_DEBUG_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Install dependencies and generate native assets
        run: |
          npm ci
          npm run native:assets
      - name: Configure and validate Firebase for device-test build
        if: github.event_name != 'pull_request'
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          test -n "$FIREBASE_ANDROID_CONFIG_BASE64"
          test -n "$FIREBASE_PROJECT_ID"
          printf '%s' "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > android/app/google-services.json
          node scripts/check-android-firebase.mjs
      - name: Build bundled native web app
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          ANDROID_APP_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_APP_SIGNING_CERT_SHA256 }}
          ANDROID_DEBUG_SIGNING_CERT_SHA256: ${{ vars.ANDROID_DEBUG_SIGNING_CERT_SHA256 }}
        run: |
          test -n "$VITE_API_URL"
          case "$VITE_API_URL" in
            https://*/api) ;;
            *) echo "VITE_API_URL must be an HTTPS API base ending in /api." >&2; exit 1 ;;
          esac
          npm run build:native
      - name: Sync Capacitor Android project
        run: npx cap sync android
      - name: Build and verify Android debug APK
        working-directory: android
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug
      - name: Verify stable device-test APK certificate
        if: github.event_name != 'pull_request'
        env:
          ANDROID_DEBUG_SIGNING_CERT_SHA256: ${{ vars.ANDROID_DEBUG_SIGNING_CERT_SHA256 }}
        run: |
          test -n "$ANDROID_DEBUG_SIGNING_CERT_SHA256"
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          actual="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | awk -F ': ' '/Signer #1 certificate SHA-256 digest:/ {gsub(":", "", $2); print toupper($2); exit}')"
          expected="$(printf '%s' "$ANDROID_DEBUG_SIGNING_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$actual" = "$expected"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: financialapp-android-debug-${{ github.event_name == 'pull_request' && 'pull-request' || 'device-test' }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  verify-production-assetlinks:
    if: github.event_name != 'pull_request'
    needs: debug-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Verify production Digital Asset Links response
        env:
          ANDROID_APP_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_APP_SIGNING_CERT_SHA256 }}
          ANDROID_DEBUG_SIGNING_CERT_SHA256: ${{ vars.ANDROID_DEBUG_SIGNING_CERT_SHA256 }}
        run: node scripts/verify-assetlinks.mjs

  signed-release-aab:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ANDROID_APP_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_APP_SIGNING_CERT_SHA256 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: 'npm'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies and prepare Firebase and signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          test -n "$ANDROID_APP_SIGNING_CERT_SHA256"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$FIREBASE_ANDROID_CONFIG_BASE64"
          test -n "$FIREBASE_PROJECT_ID"
          npm ci
          npm run native:assets
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/financialapp-release.jks"
          printf '%s' "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > android/app/google-services.json
          node scripts/check-android-firebase.mjs
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/financialapp-release.jks" >> "$GITHUB_ENV"
      - name: Build bundled native web app
        run: npm run build:native
      - name: Sync Capacitor Android project
        run: npx cap sync android
      - name: Build signed Android App Bundle
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: financialapp-android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

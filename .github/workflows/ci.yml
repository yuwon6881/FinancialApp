name: CI

on:
  push:
    branches: [master, deployment]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Type Check
        run: npm run typecheck:strict
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Knip Check
        run: npm run deadcode

name: CI

on:
  push:
    branches: [master, deployment]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Design-system audit
        run: npm run check:design-system
      - name: Type Check
        run: npm run typecheck:strict
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Visual regression
        run: npm run test:visual
      # Baselines are generated on Windows and verified here on Linux, so a failure is only
      # diagnosable with the actual/diff PNGs this run produced.
      - name: Upload visual regression diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-diffs
          path: test-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Knip Check
        run: npm run deadcode

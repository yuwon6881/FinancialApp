name: CI

on:
  push:
    branches: [master, deployment]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Secret-pattern scan
        run: npm run security:secrets
      - name: Lint
        run: npm run lint
      - name: Design-system audit
        run: npm run check:design-system
      - name: Type Check
        run: npm run typecheck:strict
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Web security-header contract
        run: npm run security:headers
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Visual regression
        run: npm run test:visual
      # Baselines are generated on Windows and verified here on Linux, so a failure is only
      # diagnosable with the actual/diff PNGs this run produced.
      - name: Upload visual regression diffs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-visual-diffs
          path: test-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Knip Check
        run: npm run deadcode

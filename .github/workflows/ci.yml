name: CI

on:
  push:
    branches: [master, deployment]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # `npm audit` fails the same way whether a dependency is vulnerable or npmjs.org is simply
      # unreachable, and the advisories bulk endpoint times out often enough to have failed this
      # pipeline on its own. Retry only the endpoint failures, and keep failing immediately on a
      # real finding: an outage must not fail the build, and must not silently pass a vulnerability
      # either, so the two cases are told apart by the error text rather than by exit code alone.
      - name: Production dependency audit
        shell: bash
        run: |
          set -uo pipefail
          transient='audit endpoint returned an error|network timeout|ENOTFOUND|ECONNRESET|ETIMEDOUT|EAI_AGAIN|socket hang up|registry returned 5[0-9][0-9]'
          for attempt in 1 2 3; do
            if output=$(npm audit --omit=dev --audit-level=high --fetch-retries=5 --fetch-retry-maxtimeout=120000 2>&1); then
              echo "$output"
              exit 0
            fi
            echo "$output"
            if grep -qiE "$transient" <<<"$output"; then
              echo "::warning::npm audit endpoint unreachable (attempt ${attempt}/3); retrying"
              sleep $((attempt * 20))
              continue
            fi
            echo "::error::npm audit reported a production vulnerability at high severity or above"
            exit 1
          done
          echo "::warning::npm audit endpoint stayed unreachable after 3 attempts; treating this run as advisory"
      - name: Secret-pattern scan
        run: npm run security:secrets
      - name: Lint
        run: npm run lint
      - name: Design-system audit
        run: npm run check:design-system
      - name: Type Check
        run: npm run typecheck:strict
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Web security-header contract
        run: npm run security:headers
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Visual regression
        run: npm run test:visual
      # Baselines are generated on Windows and verified here on Linux, so a failure is only
      # diagnosable with the actual/diff PNGs this run produced.
      - name: Upload visual regression diffs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-visual-diffs
          path: test-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Knip Check
        run: npm run deadcode
